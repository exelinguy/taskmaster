<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TaskMaster</title>
    </head>
    <body>
        <script>
            // Check storage immediately
            const savedTheme = localStorage.getItem('theme')

            // If dark, add class BEFORE the page renders
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode')
            }
        </script>

        <header id="mobile-header">
            <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
            <h1>TaskMaster</h1>

            <div style="display: flex; align-items: center">
                <label class="theme-toggle" title="Toggle Dark Mode">
                    <input
                        type="checkbox"
                        id="theme-checkbox-mobile"
                        class="theme-switch-input"
                    />
                    <span class="slider round">
                        <span>☀️</span>
                        <span>🌙</span>
                    </span>
                </label>
                <button id="mobile-add-btn" aria-label="Add Task">+</button>
            </div>
        </header>

        <div id="app-container">
            <nav id="sidebar">
                <div class="logo-area">TaskMaster</div>
                <div class="nav-section">
                    <h3>PROJECTS</h3>
                    <ul id="projects-list"></ul>
                    <button id="add-project-btn">+ Add Project</button>
                </div>
                <div class="sidebar-footer">
                    <label class="theme-toggle" title="Toggle Dark Mode">
                        <input
                            type="checkbox"
                            id="theme-checkbox-desktop"
                            class="theme-switch-input"
                        />
                        <span class="slider round">
                            <span>☀️</span>
                            <span>🌙</span>
                        </span>
                    </label>
                </div>
            </nav>

            <main id="main-content">
                <header id="content-header"></header>

                <div id="todo-list-container"></div>
            </main>
        </div>

        <div id="modal-overlay" class="hidden">
            <div id="modal-card"></div>
        </div>
    </body>
</html>
